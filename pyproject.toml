[project]
name = "pubviz"
dynamic = ["version", "readme"]
description = "Figures and tables for research papers that share one color theme and fit any venue"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jhen-Ke Lin", email = "jacob.cs14@nycu.edu.tw" }]
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10", "numpy>=2.0"]
keywords = ["matplotlib", "latex", "figures", "tables", "diagrams", "research papers", "color", "colorblind"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Matplotlib",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/JacobLinCool/pubviz"
Documentation = "https://github.com/JacobLinCool/pubviz/blob/main/docs/guide.md"
Issues = "https://github.com/JacobLinCool/pubviz/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.2.2"]

[project.scripts]
pubviz = "pubviz.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.2.2"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pubviz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pubviz"]

# The source archive holds the library only; the examples, docs and report
# stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

# PyPI shows README.md, where links and images relative to the repository
# would break. Point them at GitHub instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)#]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/JacobLinCool/pubviz/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/JacobLinCool/pubviz/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/JacobLinCool/pubviz#'

[tool.pytest.ini_options]
testpaths = ["tests"]
