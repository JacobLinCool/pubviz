# Pushing a tag v<version> builds pubviz, runs the tests on the built wheel and
# publishes it to PyPI. PyPI trusts this workflow by name (trusted publishing),
# so no token is stored in the repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; a second tag waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/pubviz-${version}.tar.gz" ] || [ ! -f "dist/pubviz-${version}-py3-none-any.whl" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the built version:"
            ls dist
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      # The tests read the examples and docs, so they need the repository too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The runner has no LaTeX, so the LaTeX tests are skipped here.
      - name: Run the tests on the built wheel
        env:
          PYTHON: ${{ matrix.python }}
        run: uv run --isolated --no-project --python "$PYTHON" --with dist/*.whl --with pytest --with pandas pytest -q

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pubviz/
    permissions:
      id-token: write # the token PyPI checks to trust this upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
